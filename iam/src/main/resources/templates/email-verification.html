<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuenta creada</title>
</head>
<body>
<div class="email-shell">
  <div class="email-card">
    <div class="email-badge">Collabrium</div>
    <h1>Cuenta creada</h1>
    <p>Ya casi terminas. Confirma tu correo para activar tu cuenta.</p>
    <a class="email-button" th:href="${verificationLink}">Verificar cuenta</a>
    <p class="email-link-text">
      Si el botón no funciona, copia este enlace:
    </p>
    <p class="email-link">
      <a th:href="${verificationLink}" th:text="${verificationLink}"></a>
    </p>
  </div>
</div>
</body>
</html>
