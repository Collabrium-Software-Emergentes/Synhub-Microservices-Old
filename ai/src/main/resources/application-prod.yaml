spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: WARN
    com.example.ai: INFO
    org.springframework.cloud.openfeign: WARN
    org.springframework.ai: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: never

  info:
    env:
      enabled: false

springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false