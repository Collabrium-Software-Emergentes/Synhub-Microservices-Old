spring:
  config:
    activate:
      on-profile: prod

#  rabbitmq:
#    ssl:
#      enabled: true

logging:
  level:
    root: WARN
    org.springframework.web: WARN
    org.springframework.amqp: WARN
    org.springframework.cloud.openfeign: WARN
    com.example.media: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: never

  info:
    env:
      enabled: false

springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false