        condition: service_healthy

      discovery-server:
        condition: service_healthy

    networks:
      - collabrium-network

  # =========================================
  # MEDIA SERVICE
  # =========================================
  media-service:
    build:
      context: ./media
      dockerfile: Dockerfile

    container_name: collabrium-media-service

    env_file:
      - ./media/.env.prod

    ports:
      - "8086:8086"

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8086/actuator/health" ]
      interval: 30s
