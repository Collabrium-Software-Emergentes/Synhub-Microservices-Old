    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8087/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

    depends_on:
      rabbitmq:
        condition: service_healthy

      discovery-server:
        condition: service_healthy

    networks:
      - collabrium-network

# =========================================
# NETWORKS
# =========================================
networks:
  collabrium-network:
    driver: bridge

# =========================================
# VOLUMES
# =========================================
volumes:
  postgres_data:
  rabbitmq_data: