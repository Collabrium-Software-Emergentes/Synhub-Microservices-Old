      retries: 3
      start_period: 90s

    depends_on:
      rabbitmq:
        condition: service_healthy

      discovery-server:
        condition: service_healthy

    networks:
      - collabrium-network

  # =========================================
  # NOTIFICATIONS SERVICE
  # =========================================
  notification-service:
    build:
      context: ./notifications
      dockerfile: Dockerfile

    container_name: collabrium-notifications-service

    env_file:
